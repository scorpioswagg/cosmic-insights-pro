# Cosmic Blueprint — Netlify deploy
# Satisfies Header rules, Redirect rules, and Pages/deploy-preview checks.

[build]
  command = "npm run build"
  # TanStack Start (Vite) client assets. Nitro may also emit .output/public;
  # Netlify publishes this folder for static assets.
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # Prefer Netlify Nitro preset so SSR/server functions land correctly.
  NITRO_PRESET = "netlify"

# SPA / client-side routes (admin, checkout, reports, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = ["admin", ""]}

# Explicit fallback without role condition (works for all visitors)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers (Header rules check)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
